<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
</head>

<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand text-white" href="{% url 'Homepage' %}">Home</a>
            <div class="d-flex">
                {% if user.is_authenticated %}
                <a class="btn btn-outline-warning text-white" href="{% url 'profile' %}"> Profile</a>
                <a class="btn btn-outline-warning text-white" href="{% url 'logout' %}"> Log Out</a>
                {% else %}
                <a class="btn btn-outline-warning text-white" href="{% url 'login' %}"> Log In</a>
                <a class="btn btn-outline-success mx-4 text-white" href="{% url 'Signup' %}"> Sign Up</a>

                {% endif %}
                
            </div>
        </div>
    </nav>
    {% block content %}
    {% endblock %}
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
