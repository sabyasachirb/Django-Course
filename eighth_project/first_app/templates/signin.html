{% extends 'base.html' %}

{% block content %}


{% load crispy_forms_tags %}
  <h3 style="display: flex; justify-content: center; margin: 1rem;">Login Page</h3>
  <form method="post" style="width:50%; margin: auto; display: flex; flex-direction: column; gap: 0.5rem;" novalidate>
    {% csrf_token %}
    <!-- {{form|crispy}} -->
     {% if form.non_field_errors %}
    {% for er in form.non_field_errors %}
    <p class="bg-danger text-white p-3">{{er}}</p>
    {% endfor %}
    {% endif %}
    {% for f in form %}
    {{f.label_tag}}
    {{f}}
    {{f.errors|striptags}}
    {%endfor%}
    <input type="submit" value="Log In" class="btn btn-warning">
  </form>
{% endblock %}
